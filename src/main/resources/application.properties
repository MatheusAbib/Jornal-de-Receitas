# =========================
# Servidor (Droplet DigitalOcean)
# =========================
server.port=${PORT:8082}

# =========================
# Banco de Dados (MySQL local no droplet)
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/receitas?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:NovaSenha@2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# =========================
# HikariCP (pool enxuto para 1 GB RAM)
# =========================
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000

# =========================
# Upload de arquivos
# =========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${APP_UPLOAD_DIR:/var/www/jornal-receitas/uploads}

# =========================
# CORS (Vercel + dev local)
# =========================
cors.allowed.origins=https://jornal-de-receitas.vercel.app,https://jornal-de-receitas*.vercel.app,http://localhost:5173

# =========================
# Sessão / Cookie (funcionando atrás do rewrite do Vercel)
# =========================
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=8h
server.servlet.session.tracking-modes=cookie

# =========================
# Inicialização
# =========================
spring.main.lazy-initialization=true

# =========================
# Logs (produção = menos ruído)
# =========================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

