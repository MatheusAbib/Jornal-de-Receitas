<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jornal de Receitas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/global/style.css">
  <link rel="stylesheet" href="/css/admin/carrossel.css">
  <link th:href="${faviconUrl}" rel="icon" th:if="${faviconUrl != null}">
</head>
<body>

<div th:replace="~{global/cabecalho}"></div>

<main class="admin-content-wrapper">

  <div class="admin-topbar">
    <h1><i class="fas fa-images"></i> Carrossel</h1>
    <div class="admin-topbar-actions">
      <span><i class="fas fa-list"></i> Total: <strong th:text="${carrosselItens.size()}">0</strong></span>
      <button type="button" class="carrossel-btn-novo" onclick="abrirNovoItem()">
        <i class="fas fa-plus"></i> Novo Item
      </button>
    </div>
  </div>

  <div class="carrossel-grid" th:if="${!carrosselItens.isEmpty()}">
    <div class="carrossel-card" th:each="item : ${carrosselItens}">

      <div class="carrossel-card-img">
        <img th:src="${#strings.startsWith(item.imagemUrl, 'http') ? item.imagemUrl : '/uploads/' + item.imagemUrl}" th:alt="${item.titulo}">
        <span class="carrossel-card-ordem">
          <i class="fas fa-sort-numeric-up"></i>
          <span th:text="${item.ordemExibicao}">0</span>
        </span>
        <span th:class="${item.ativo} ? 'carrossel-card-status ativo' : 'carrossel-card-status inativo'">
          <i th:class="${item.ativo} ? 'fas fa-eye' : 'fas fa-eye-slash'"></i>
          <span th:text="${item.ativo} ? 'Ativo' : 'Inativo'"></span>
        </span>
      </div>

      <div class="carrossel-card-body">
        <h3 th:text="${item.titulo}">Título</h3>
        <p th:text="${item.descricao}">Descrição</p>
        <span class="carrossel-card-link" th:if="${item.linkDestino != null && !item.linkDestino.isEmpty()}">
          <i class="fas fa-link"></i>
          <span th:text="${item.linkDestino}">/link</span>
        </span>
      </div>

      <div class="carrossel-card-actions">
        <button type="button" class="carrossel-action-btn edit"
                th:attr="data-id=${item.id},
                         data-titulo=${item.titulo},
                         data-descricao=${item.descricao} ?: '',
                         data-imagem=${item.imagemUrl},
                         data-ordem=${item.ordemExibicao} ?: '',
                         data-link=${item.linkDestino} ?: ''"
                onclick="abrirEdicaoItem(this)">
          <i class="fas fa-edit"></i> Editar
        </button>

        <form th:action="@{/carrossel/toggle/{id}(id=${item.id})}" method="post" style="display:inline">
          <button type="submit" class="carrossel-action-btn toggle">
            <i th:class="${item.ativo} ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            <span th:text="${item.ativo} ? 'Desativar' : 'Ativar'"></span>
          </button>
        </form>

        <button type="button" class="carrossel-action-btn delete"
                th:attr="data-id=${item.id}, data-titulo=${item.titulo}"
                onclick="abrirExclusaoItem(this)">
          <i class="fas fa-trash"></i> Excluir
        </button>
      </div>

    </div>
  </div>

  <div class="carrossel-empty" th:if="${carrosselItens.isEmpty()}">
    <i class="fas fa-images"></i>
    <h3>Nenhum item no carrossel</h3>
    <p>Clique em "Novo Item" para adicionar o primeiro.</p>
  </div>

</main>

<div id="itemModal" class="carrossel-modal">
  <div class="carrossel-modal-content">
    <div class="carrossel-modal-header">
      <h2 id="itemModalTitulo"><i class="fas fa-plus"></i> Novo Item</h2>
      <span class="carrossel-modal-close" onclick="fecharItemModal()">&times;</span>
    </div>

    <form id="itemForm" method="post" enctype="multipart/form-data" th:action="@{/carrossel/adicionar}">
      <div class="carrossel-form-group">
        <label for="itemTitulo">Título</label>
        <input type="text" id="itemTitulo" name="titulo" placeholder="Ex: Bolo de Chocolate" required>
      </div>

      <div class="carrossel-form-group">
        <label for="itemDescricao">Descrição</label>
        <textarea id="itemDescricao" name="descricao" rows="3" placeholder="Ex: Uma receita incrível para os amantes de chocolate"></textarea>
      </div>

      <div class="carrossel-form-group">
        <label for="itemImagemUrl">URL da Imagem</label>
        <input type="text" id="itemImagemUrl" name="imagemUrl" placeholder="https://exemplo.com/imagem.jpg">
      </div>

      <div class="carrossel-form-group">
        <label for="itemImagemFile">Ou envie um arquivo</label>
        <div class="carrossel-file-wrapper">
          <input type="file" id="itemImagemFile" name="imagemFile" accept="image/*">
          <label for="itemImagemFile" class="carrossel-file-label">
            <i class="fas fa-upload"></i>
            <span id="itemImagemFileName">Escolher arquivo</span>
          </label>
        </div>
      </div>
        <div class="carrossel-form-group">
        <div class="carrossel-preview-wrapper" id="itemImagemPreviewWrapper" style="display:none;">
          <img id="itemImagemPreview" src="" alt="Preview">
        </div>
      </div>
      <div class="carrossel-form-row">
        <div class="carrossel-form-group">
          <label for="itemOrdem">Ordem de Exibição</label>
          <input type="number" id="itemOrdem" name="ordemExibicao" min="1" placeholder="Ex: 1">
        </div>

        <div class="carrossel-form-group">
          <label for="itemLink">Link de Destino</label>
          <input type="text" id="itemLink" name="linkDestino" placeholder="Ex: /detalhe/123">
        </div>
      </div>

      <div class="carrossel-modal-actions">
        <button type="button" class="carrossel-btn cancel" onclick="fecharItemModal()">
          <i class="fas fa-times"></i> Cancelar
        </button>
        <button type="submit" class="carrossel-btn save" disabled>
          <i class="fas fa-save"></i> Salvar
        </button>
      </div>
    </form>
  </div>
</div>

<div id="excluirItemModal" class="carrossel-modal">
  <div class="carrossel-modal-content carrossel-modal-delete">
    <div class="carrossel-modal-header">
      <h2><i class="fas fa-exclamation-triangle"></i> Excluir Item</h2>
      <span class="carrossel-modal-close" onclick="fecharExclusaoItem()">&times;</span>
    </div>

    <p class="carrossel-delete-msg">
      Tem certeza que deseja excluir <strong id="excluirItemTitulo"></strong>?
    </p>
    <p class="carrossel-delete-warning">
      <i class="fas fa-exclamation-circle"></i> Esta ação não pode ser desfeita.
    </p>

    <form id="excluirItemForm" method="post">
      <div class="carrossel-modal-actions">
        <button type="button" class="carrossel-btn cancel" onclick="fecharExclusaoItem()">
          <i class="fas fa-times"></i> Cancelar
        </button>
        <button type="submit" class="carrossel-btn delete">
          <i class="fas fa-trash"></i> Excluir
        </button>
      </div>
    </form>
  </div>
</div>

<div th:replace="~{modais/modal-logout}"></div>

<script src="/js/admin/carrossel.js"></script>
<script src="/js/global/cabecalho.js"></script>
<script src="/js/modais/modais.js"></script>
<script src="/js/global/global-loader-buttons.js"></script>
</body>
</html>
