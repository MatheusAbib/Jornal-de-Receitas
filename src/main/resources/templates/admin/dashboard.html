<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dashboard - Jornal de Receitas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/global/style.css">
  <link rel="stylesheet" href="/css/admin/dashboard.css">
  <link th:href="${faviconUrl}" rel="icon" th:if="${faviconUrl != null}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div th:replace="~{global/cabecalho}"></div>

<main class="admin-content-wrapper">

  <div class="admin-topbar">
    <h1><i class="fas fa-chart-line"></i> Dashboard</h1>
    <div class="admin-topbar-actions">
      <span><i class="fas fa-calendar"></i> Visão geral do site</span>
    </div>
  </div>

  <div class="dashboard-cards">

    <div class="dashboard-card">
      <div class="card-icon card-icon-users">
        <i class="fas fa-users"></i>
      </div>
      <div class="card-info">
        <span class="card-label">Total de Usuários</span>
        <span class="card-value" th:text="${totalUsuarios}">0</span>
      </div>
    </div>

    <div class="dashboard-card">
      <div class="card-icon card-icon-active">
        <i class="fas fa-user-check"></i>
      </div>
      <div class="card-info">
        <span class="card-label">Usuários Ativos</span>
        <span class="card-value" th:text="${usuariosAtivos}">0</span>
      </div>
    </div>

    <div class="dashboard-card">
      <div class="card-icon card-icon-pending">
        <i class="fas fa-clock"></i>
      </div>
      <div class="card-info">
        <span class="card-label">Receitas Pendentes</span>
        <span class="card-value" th:text="${totalPendentes}">0</span>
      </div>
    </div>

    <div class="dashboard-card">
      <div class="card-icon card-icon-approved">
        <i class="fas fa-check-circle"></i>
      </div>
      <div class="card-info">
        <span class="card-label">Receitas Aprovadas</span>
        <span class="card-value" th:text="${totalAprovadas}">0</span>
      </div>
    </div>

    <div class="dashboard-card">
      <div class="card-icon card-icon-rejected">
        <i class="fas fa-times-circle"></i>
      </div>
      <div class="card-info">
        <span class="card-label">Receitas Rejeitadas</span>
        <span class="card-value" th:text="${totalRejeitadas}">0</span>
      </div>
    </div>

    <div class="dashboard-card">
      <div class="card-icon card-icon-fav">
        <i class="fas fa-heart"></i>
      </div>
      <div class="card-info">
        <span class="card-label">Total de Favoritos</span>
        <span class="card-value" th:text="${totalFavoritos}">0</span>
      </div>
    </div>

  </div>

  <div class="dashboard-grid">

    <div class="dashboard-panel">
      <div class="panel-header">
        <h2><i class="fas fa-chart-pie"></i> Receitas por Status</h2>
      </div>
      <div class="panel-body">
        <canvas id="graficoStatus"></canvas>
      </div>
    </div>

    <div class="dashboard-panel">
      <div class="panel-header">
        <h2><i class="fas fa-fire"></i> Top 5 Receitas Mais Favoritadas</h2>
      </div>
      <div class="panel-body">
        <canvas id="graficoTop"></canvas>
      </div>
    </div>

  </div>

</main>

<div th:replace="~{modais/modal-logout}"></div>

<script th:inline="javascript">
  const totalPendentes = /*[[${totalPendentes}]]*/ 0;
  const totalAprovadas = /*[[${totalAprovadas}]]*/ 0;
  const totalRejeitadas = /*[[${totalRejeitadas}]]*/ 0;

  const topReceitas = /*[[${topReceitas}]]*/ [];

  const corVermelho = '#8b0000';
  const corDourado = '#d4af37';
  const corCinza = '#a0a0a0';

  const ctxStatus = document.getElementById('graficoStatus');
  new Chart(ctxStatus, {
    type: 'doughnut',
    data: {
      labels: ['Pendentes', 'Aprovadas', 'Rejeitadas'],
      datasets: [{
        data: [totalPendentes, totalAprovadas, totalRejeitadas],
        backgroundColor: [corDourado, '#27ae60', corVermelho],
        borderColor: '#fff',
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            font: { family: 'Inter', size: 13, weight: '600' },
            color: '#333',
            padding: 15
          }
        }
      }
    }
  });

  const ctxTop = document.getElementById('graficoTop');

  const titulosTop = topReceitas.map(r => r.titulo);
  const valoresTop = topReceitas.map(r => r.total);

  new Chart(ctxTop, {
    type: 'bar',
    data: {
      labels: titulosTop,
      datasets: [{
        label: 'Favoritos',
        data: valoresTop,
        backgroundColor: corVermelho,
        borderColor: corVermelho,
        borderWidth: 1
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false }
      },
      scales: {
        x: {
          beginAtZero: true,
          ticks: { color: '#333', font: { family: 'Inter', size: 12 } },
          grid: { color: 'rgba(139,0,0,0.08)' }
        },
        y: {
          ticks: { color: '#333', font: { family: 'Inter', size: 12, weight: '600' } },
          grid: { display: false }
        }
      }
    }
  });
</script>

<script src="/js/global/image-loader.js"></script>
<script src="/js/global/cabecalho.js"></script>
<script src="/js/modais/modais.js"></script>
<script src="/js/global/global-loader-buttons.js"></script>
<script th:src="@{/js/global/polling.js}"></script>
<script src="/js/admin/usuario.js"></script>
</body>
</html>
