<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<div th:fragment="modais">

  <div id="detalhesModal" class="detalhes-modal-box">
    <div id="detalhesModalConteudo"></div>
  </div>

  <div id="editModal" class="modal edit-user-modal">
    <div class="modal-content-edit">
      <span class="close close-edit-user-modal" onclick="closeEditModal()">&times;</span>
      <div class="modal-header-edit">
        <h2><i class="fas fa-edit"></i> Editar Receita</h2>
      </div>
      <div class="modal-body-edit">
        <form id="editForm" method="post" enctype="multipart/form-data">
          <div class="form-grid">
            <div class="form-group-edit">
              <div class="input-with-icon">
                <input type="text" id="editTitulo" name="titulo" class="form-control-edit" placeholder=" " required>
                <label for="editTitulo">Título</label>
                <i class="fas fa-utensils"></i>
              </div>
            </div>
            <div class="form-group-edit">
              <div class="input-with-icon">
                <input type="text" id="editChefe" name="chefe" class="form-control-edit" placeholder=" ">
                <label for="editChefe">Chefe</label>
                <i class="fas fa-user"></i>
              </div>
            </div>
            <div class="form-group-edit">
              <div class="input-with-icon">
                <input type="text" id="editTempo" name="tempoPreparo" class="form-control-edit" placeholder=" ">
                <label for="editTempo">Tempo de Preparo</label>
                <i class="fas fa-clock"></i>
              </div>
            </div>
            <div class="form-group-edit">
              <div class="input-with-icon">
                <input type="number" id="editPorcoes" name="porcoes" class="form-control-edit" placeholder=" " min="1">
                <label for="editPorcoes">Porções</label>
                <i class="fas fa-users"></i>
              </div>
            </div>
            <div class="form-group-edit">
              <div class="input-with-icon">
                <select id="editCategoria" name="categoria" class="form-control-edit">
                  <option value="SALGADO">Salgado</option>
                  <option value="DOCE">Doce</option>
                </select>
                <label for="editCategoria">Categoria</label>
                <i class="fas fa-tag"></i>
              </div>
            </div>
          </div>

          <div class="form-group-edit form-group-edit-full">
            <label class="edit-receita-label"><i class="fas fa-image"></i> Imagem da Receita</label>
            <div class="imagem-upload-box">
              <div class="imagem-preview-wrapper">
                <img id="editImagemPreview" src="" alt="Imagem atual">
                <div class="imagem-sem-preview">
                  <i class="fas fa-image"></i>
                  <span>Sem imagem</span>
                </div>
              </div>
              <div class="imagem-upload-info">
                <p id="editImagemInfo">Imagem atual mantida</p>
                <label for="editImagem" class="imagem-btn-upload">
                  <i class="fas fa-upload"></i> Escolher imagem
                </label>
                <input type="file" id="editImagem" name="imagemFile" accept="image/*" hidden>
              </div>
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group-edit">
              <label class="edit-receita-label">
                <i class="fas fa-list"></i> Ingredientes
                <span class="contador-badge" id="contadorIngredientes">0</span>
              </label>
              <textarea id="editIngredientes" name="ingredientesTexto" class="form-control-edit form-textarea" rows="6"></textarea>
            </div>

            <div class="form-group-edit">
              <label class="edit-receita-label">
                <i class="fas fa-book-open"></i> Modo de Preparo
                <span class="contador-badge" id="contadorPassos">0</span>
              </label>
              <textarea id="editModoPreparo" name="modoPreparoTexto" class="form-control-edit form-textarea" rows="6"></textarea>
            </div>
          </div>

          <div class="modal-actions-edit">
            <button type="button" class="modal-button-edit cancel" onclick="closeEditModal()">
              <i class="fas fa-times"></i> Cancelar
            </button>
            <button type="submit" class="modal-button-edit save">
              <i class="fas fa-save"></i> Salvar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

</div>

</body>
</html>
