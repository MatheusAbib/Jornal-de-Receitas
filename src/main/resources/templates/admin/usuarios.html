<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jornal de Receitas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/global/style.css">
  <link th:href="${faviconUrl}" rel="icon" th:if="${faviconUrl != null}">
</head>
<body>

<div th:replace="~{global/cabecalho}"></div>

<main class="admin-content-wrapper">
  <div class="admin-topbar">
    <h1> Usuários</h1>
    <div class="admin-topbar-actions">
      <span><i class="fas fa-user"></i> Total: <strong id="totalUsuarios" th:text="${usuarios.size()}"></strong></span>
      <div class="admin-search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="userSearch" placeholder="Buscar usuário..." onkeyup="filterUsers()">
      </div>
    </div>
  </div>

  <div class="admin-table-wrapper">
    <div class="admin-table-container">
      <div class="admin-table-header">
        <div class="count">
          <i class="fas fa-list"></i> <span th:text="${usuarios.size()}"></span> registros
        </div>
      </div>

      <div class="admin-table-scroll">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Email</th>
              <th>CPF</th>
              <th>Cadastro</th>
              <th>Status</th>
              <th class="text-center">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="usuario : ${usuarios}" class="user-row">
              <td data-label="ID" th:text="${usuario.id}"></td>
              <td data-label="Nome" th:text="${usuario.nome}"></td>
              <td data-label="Email" th:text="${usuario.email}"></td>
              <td data-label="CPF" th:text="${usuario.cpf}"></td>
              <td data-label="Cadastro" th:text="${usuario.dataCadastro}"></td>
              <td data-label="Status">
                <span th:class="${usuario.ativo} ? 'status-badge active' : 'status-badge inactive'" 
                      th:text="${usuario.ativo} ? 'Ativo' : 'Inativo'"></span>
              </td>
              <td data-label="Ações" class="text-center">
                <div class="actions-group">
                  <button type="button" class="action-btn btn-edit"
                          th:attr="data-id=${usuario.id}, 
                                  data-nome=${usuario.nome}, 
                                  data-email=${usuario.email}, 
                                  data-cpf=${usuario.cpf},  
                                  data-telefone=${usuario.telefone} ?: '', 
                                  data-genero=${usuario.genero} ?: '', 
                                  data-role=${usuario.role} ?: 'USER'"
                          onclick="openEditModal(this)">
                    <i class="fas fa-edit"></i>
                  </button>

                  <form th:action="@{/usuarios/ativar/{id}(id=${usuario.id})}" method="post" style="display:inline">
                    <label class="switch">
                      <input type="checkbox" name="ativo" th:checked="${usuario.ativo}" onchange="this.form.submit()">
                      <span class="slider round"></span>
                    </label>
                  </form>

                  <button type="button" class="action-btn btn-delete" 
                          th:attr="data-id=${usuario.id}, 
                                  data-nome=${usuario.nome}, 
                                  data-email=${usuario.email}, 
                                  data-cpf=${usuario.cpf}"
                          onclick="openDeleteModal(this)">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="admin-empty" id="usersEmpty" style="display: none;">
        <i class="fas fa-users-slash"></i>
        <h3>Nenhum usuário encontrado</h3>
        <p>Tente ajustar os filtros de busca</p>
      </div>

      <div class="admin-table-footer">
        <div class="info">
          Mostrando <span data-total="${totalItems}" th:text="${totalItems}"></span> de <span id="totalOriginal" th:text="${totalItems}"></span> usuários
        </div>
        <div class="admin-pagination" th:if="${totalPages > 1}">
          <a th:if="${currentPage > 0}" th:href="@{/usuarios(page=${currentPage - 1}, size=${pageSize})}">
            <i class="fas fa-chevron-left"></i>
          </a>
          <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}" 
             th:href="@{/usuarios(page=${i}, size=${pageSize})}" 
             th:text="${i + 1}" 
             th:class="${i == currentPage} ? 'active' : ''"></a>
          <a th:if="${currentPage < totalPages - 1}" th:href="@{/usuarios(page=${currentPage + 1}, size=${pageSize})}">
            <i class="fas fa-chevron-right"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</main>



<div id="deleteUserModal" class="modal delete-user-modal">
  <div class="modal-content-delete">
    <span class="close close-delete-user-modal">&times;</span>
    <div class="modal-header-delete">
      <h2><i class="fas fa-exclamation-triangle"></i> Excluir Usuário</h2>
    </div>
    <div class="modal-icon-delete">
      <i class="fas fa-user-slash"></i>
    </div>
    <div class="modal-message">
      Tem certeza que deseja excluir permanentemente?
    </div>
    <div class="user-info-card">
      <div class="user-info-item">
        <i class="fas fa-user"></i>
        <span><strong>Nome:</strong> <span id="deleteUserName"></span></span>
      </div>
      <div class="user-info-item">
        <i class="fas fa-envelope"></i>
        <span><strong>Email:</strong> <span id="deleteUserEmail"></span></span>
      </div>
      <div class="user-info-item">
        <i class="fas fa-id-card"></i>
        <span><strong>CPF:</strong> <span id="deleteUserCpf"></span></span>
      </div>
    </div>
    <div class="modal-warning">
      <i class="fas fa-exclamation-circle"></i>
      <span>Esta ação não pode ser desfeita.</span>
    </div>
    <div class="modal-actions-delete">
      <button class="modal-button-delete cancel">
        <i class="fas fa-times"></i> Cancelar
      </button>
      <button type="button" class="modal-button-delete confirm" data-spinner="true">
        <i class="fas fa-trash"></i> Excluir
      </button>
    </div>
  </div>
</div>

<div id="editUserModal" class="modal edit-user-modal">
  <div class="modal-content-edit">
    <span class="close close-edit-user-modal" onclick="closeEditModal()">&times;</span>
    <div class="modal-header-edit">
      <h2><i class="fas fa-user-edit"></i> Editar Usuário</h2>
    </div>
    <div class="modal-body-edit">
      <form id="editUserForm" method="post" th:action="@{/usuarios/editar/{id}(id=${editUserId})}">
        <input type="hidden" name="id" id="editUserId">
        <div class="form-grid">
          <div class="form-group-edit">
            <div class="input-with-icon">
              <input type="text" id="editUserNome" name="nome" class="form-control-edit" placeholder=" " required>
              <label for="editUserNome">Nome</label>
              <i class="fas fa-user"></i>
            </div>
          </div>
          <div class="form-group-edit">
            <div class="input-with-icon">
              <input type="email" id="editUserEmail" name="email" class="form-control-edit" placeholder=" " required>
              <label for="editUserEmail">Email</label>
              <i class="fas fa-at"></i>
            </div>
          </div>
          <div class="form-group-edit">
            <div class="input-with-icon">
              <input type="text" id="editUserCpf" name="cpf" class="form-control-edit" placeholder=" " readonly>
              <label for="editUserCpf">CPF</label>
              <i class="fas fa-id-card"></i>
            </div>
          </div>
          <div class="form-group-edit">
            <div class="input-with-icon">
              <input type="text" id="editUserTelefone" name="telefone" class="form-control-edit" placeholder=" ">
              <label for="editUserTelefone">Telefone</label>
              <i class="fas fa-phone"></i>
            </div>
          </div>
          <div class="form-group-edit">
            <div class="input-with-icon">
              <select id="editUserGenero" name="genero" class="form-control-edit">
                <option value="">Selecione...</option>
                <option value="MASCULINO">Masculino</option>
                <option value="FEMININO">Feminino</option>
                <option value="OUTRO">Outro</option>
              </select>
              <label for="editUserGenero">Gênero</label>
              <i class="fas fa-venus-mars"></i>
            </div>
          </div>
          <div class="form-group-edit">
            <div class="input-with-icon">
              <select id="editUserRole" name="role" class="form-control-edit">
                <option value="USER">Usuário</option>
                <option value="ADMIN">Administrador</option>
              </select>
              <label for="editUserRole">Tipo</label>
              <i class="fas fa-user-tag"></i>
            </div>
          </div>
          <div class="form-group-edit">
            <div class="input-with-icon">
              <input type="password" id="editUserSenha" name="senha" class="form-control-edit" placeholder=" ">
              <label for="editUserSenha">Nova Senha</label>
              <i class="fas fa-key"></i>
            </div>
          </div>
          <div class="form-group-edit">
            <div class="input-with-icon">
              <input type="password" id="editUserConfirmarSenha" name="confirmarSenha" class="form-control-edit" placeholder=" ">
              <label for="editUserConfirmarSenha">Confirmar</label>
              <i class="fas fa-key"></i>
            </div>
          </div>
        </div>
        <div class="modal-actions-edit">
          <button type="button" class="modal-button-edit cancel">
            <i class="fas fa-times"></i> Cancelar
          </button>
          <button type="submit" class="modal-button-edit save" disabled>
            <i class="fas fa-save"></i> Salvar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<div th:replace="~{modais/modal-logout}"></div>

<script src="/js/admin/usuario.js"></script>
<script src="/js/global/image-loader.js"></script>
<script src="/js/global/cabecalho.js"></script>
<script src="/js/modais/modais.js"></script>
<script th:src="@{/js/global/polling.js}"></script>
<script src="/js/global/global-loader-buttons.js"></script>
</body>
</html>
