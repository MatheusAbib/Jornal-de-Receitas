<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head></head>
<body>
  <div th:fragment="sidebar">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h3>Jornal de Receitas</h3>
        <span class="sidebar-close" id="sidebarClose"><i class="fas fa-times"></i></span>
      </div>
      <a th:href="@{/}" th:classappend="${paginaAtual == 'inicio'} ? 'active' : ''">
        <i class="fas fa-home"></i> Início
      </a>
    <a th:href="@{/sobre}" th:classappend="${paginaAtual == 'sobre'} ? 'active' : ''">
      <i class="fas fa-info-circle"></i> Sobre o Site
    </a>
      <a sec:authorize="!isAuthenticated()" href="#" onclick="openCadastroModal(); return false;">
        <i class="fas fa-user-plus"></i> Se Cadastrar
      </a>
      <a sec:authorize="!isAuthenticated()" href="#" onclick="openLoginModal(); return false;">
        <i class="fas fa-sign-in-alt"></i> Fazer Login
      </a>
      <a sec:authorize="hasRole('ADMIN')" th:href="@{/usuarios}" th:classappend="${paginaAtual == 'usuarios'} ? 'active' : ''">
        <i class="fas fa-users"></i> Usuários
      </a>
      <a sec:authorize="hasRole('ADMIN')" href="/pendentes" th:classappend="${paginaAtual == 'pendentes'} ? 'active' : ''">
        <i class="fas fa-clock"></i> Receitas Pendentes
      </a>
      <a sec:authorize="isAuthenticated()" href="/nova" th:classappend="${paginaAtual == 'nova'} ? 'active' : ''">
        <i class="fas fa-utensils"></i> Envie sua Receita
      </a>
      <a sec:authorize="isAuthenticated()" href="#" onclick="openLogoutModal(); return false;">
        <i class="fas fa-sign-out-alt"></i> Sair
      </a>
    </div>
  </div>
</body>
</html>
