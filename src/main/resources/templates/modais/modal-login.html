<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head></head>

<body>

    <div th:fragment="modal-login">

        <div id="loginModal" class="login-modal-box">

            <div class="login-modal-content">

                <div class="login-modal-header">

                    <h2>
                        <i class="fas fa-sign-in-alt"></i>
                        Acessar Conta
                    </h2>

                    <span class="login-modal-close close-login-modal">
                        &times;
                    </span>

                </div>

                <div class="login-modal-body">

                    <div id="loginError"
                         class="login-error"
                         style="display: none;">

                        <i class="fas fa-exclamation-circle"></i>

                        <span id="errorMessage"></span>

                    </div>

                    <form id="loginForm" method="post">

                        <div class="login-form-group">

                            <div class="login-input-float">

                                <input
                                    type="email"
                                    id="username"
                                    name="username"
                                    class="login-form-control-float"
                                    placeholder=" "
                                    required
                                    autocomplete="email">

                                <label for="username">
                                    E-mail
                                </label>

                                <i class="fas fa-envelope"></i>

                            </div>

                        </div>

                        <div class="login-form-group">

                            <div class="login-input-float">

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="login-form-control-float"
                                    placeholder=" "
                                    required
                                    autocomplete="current-password">

                                <label for="password">
                                    Senha
                                </label>

                                <i class="fas fa-lock"></i>

                                <span
                                    class="login-password-toggle"
                                    onclick="toggleLoginPassword()">
                                </span>

                            </div>

                        </div>

                        <div class="login-options">

                            <label class="remember-me">

                                <input
                                    type="checkbox"
                                    id="remember"
                                    name="remember">

                                Lembrar-me

                            </label>

                        </div>

                    <button
                        type="submit"
                        id="loginSubmitBtn"
                        class="login-submit-btn"
                        disabled>
                        <i class="fas fa-sign-in-alt"></i> Entrar
                    </button>

                    </form>

                    <div class="login-register-link">

                        Não tem uma conta?

                        <a
                            href="#"
                            onclick="closeLoginModal(); openCadastroModal(); return false;">

                            Cadastre-se aqui

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
