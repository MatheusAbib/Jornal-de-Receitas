<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jornal de Receitas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link th:href="${faviconUrl}" rel="icon" th:if="${faviconUrl != null}">
  <link rel="stylesheet" href="/css/global/style.css">
</head>
<body>

<header class="detalhe-topbar">
  <a href="/" class="detalhe-topbar-back">
    <i class="fas fa-arrow-left"></i>
    <span class="detalhe-topbar-back-text-full">Voltar para a página inicial</span>
    <span class="detalhe-topbar-back-text-short">Voltar</span>
  </a>
  <span class="detalhe-topbar-title">Detalhes da Receita</span>
</header>

<main class="detalhe-container">

  <div class="detalhe-card">
    <div class="detalhe-hero">
      <div class="detalhe-image">
        <img th:if="${receita.imagem != null and (receita.imagem.startsWith('http') or receita.imagem.startsWith('https'))}"
             th:src="${receita.imagem}" alt="Imagem da receita">
        <img th:if="${receita.imagem != null and !(receita.imagem.startsWith('http') or receita.imagem.startsWith('https'))}"
             th:src="@{'/uploads/' + ${receita.imagem}}" alt="Imagem da receita">
        <img th:if="${receita.imagem == null}" src="/default-image.jpg" alt="Imagem padrão">
      </div>

      <div class="detalhe-info">
        <div class="detalhe-info-header">
          <div class="detalhe-badge-categoria" th:classappend="${receita.categoria == T(com.receitas.site_receitas.model.Receita.Categoria).DOCE} ? 'doce' : 'salgado'">
            <i class="fas fa-cake-candles" th:if="${receita.categoria == T(com.receitas.site_receitas.model.Receita.Categoria).DOCE}"></i>
            <i class="fas fa-pepper-hot" th:if="${receita.categoria != T(com.receitas.site_receitas.model.Receita.Categoria).DOCE}"></i>
            <span th:text="${receita.categoria == T(com.receitas.site_receitas.model.Receita.Categoria).DOCE} ? 'Doce' : 'Salgado'"></span>
          </div>
          <div class="detalhe-info-actions">
            <button class="detalhe-favorite-btn" th:data-recipe-id="${receita.id}">
              <i class="far fa-heart"></i>
              <span>Favoritar</span>
            </button>
            <button class="detalhe-print-btn">
                <i class="fas fa-print"></i>
                <span>Imprimir</span>
            </button>
          </div>
        </div>

        <h1 class="detalhe-titulo" th:text="${receita.titulo}">Título da Receita</h1>

        <div class="detalhe-meta">
          <div class="detalhe-meta-item">
            <i class="fas fa-clock"></i>
            <span th:text="${receita.tempoPreparo}">30 min</span>
          </div>
          <div class="detalhe-meta-item">
            <i class="fas fa-utensils"></i>
            <span th:text="${receita.porcoes} + ' porções'">4 porções</span>
          </div>
          <div class="detalhe-meta-item">
            <i class="fas fa-user"></i>
            <span th:text="${receita.chefe}">Chef</span>
          </div>

          <div class="detalhe-meta-item" th:if="${receita.status == T(com.receitas.site_receitas.model.Receita.StatusReceita).PENDENTE}">
            <i class="fas fa-clock" style="color: #e67e22;"></i>
            <span>Pendente</span>
          </div>
        </div>
      </div>
    </div>

    <div class="detalhe-body">
      <div class="detalhe-section ingredientes">
        <div class="detalhe-section-header">
          <i class="fas fa-list-check"></i>
          <h2>Ingredientes</h2>
          <span class="detalhe-section-count" th:text="${ingredientesList.size()} + ' itens'"></span>
        </div>
        <ul class="detalhe-ingredientes-list">
          <li class="detalhe-ingrediente-item" th:each="ingrediente : ${ingredientesList}">
            <input type="checkbox" class="detalhe-ingrediente-checkbox" th:id="'ing-' + ${ingredienteStat.index}">
            <label class="detalhe-ingrediente-text" th:for="'ing-' + ${ingredienteStat.index}" th:text="${ingrediente}">Ingrediente</label>
          </li>
        </ul>
      </div>

      <div class="detalhe-section preparo">
        <div class="detalhe-section-header">
          <i class="fas fa-mortar-pestle"></i>
          <h2>Modo de Preparo</h2>
          <span class="detalhe-section-count" th:text="${modoPreparoList.size()} + ' passos'"></span>
        </div>
        <ol class="detalhe-preparo-list">
          <li class="detalhe-preparo-item" th:each="passo, iterStat : ${modoPreparoList}">
            <span class="detalhe-preparo-number" th:text="${iterStat.index + 1}"></span>
            <span class="detalhe-preparo-text" th:text="${passo}">Passo do preparo</span>
          </li>
        </ol>
      </div>
    </div>
  </div>
</main>

<div class="content-wrapper">
  <div th:replace="~{global/rodape}"></div>
</div>

<script src="/js/principal/receita/detalhes-receita.js"></script>
<script src="/js/global/global-loader-buttons.js"></script>
<script src="/js/global/cabecalho.js"></script>
<script src="/js/global/sidebar.js"></script>
<script src="/js/global/image-loader.js"></script>
<script src="/js/modais/modais.js"></script>
<script src="/js/principal/index.js"></script>
<script th:src="@{/js/global/polling.js}"></script>

</body>
</html>
